# Nginx Load Balancer Configuration for Agent API
# Handles up to 5k requests per second

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend servers
    # Docker Compose will resolve agent-api to all scaled instances
    upstream agent_api_backend {
        # Use least_conn for better load distribution
        least_conn;
        
        # Docker Compose service name resolves to all instances
        # When scaled, Docker DNS returns all IPs
        server agent-api:8100 max_fails=3 fail_timeout=30s;
        
        # Keep connections alive for better performance
        keepalive 32;
        
        # Enable keepalive connections
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 8100;
        server_name _;

        # Rate limiting
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 100;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://agent_api_backend;
        }

        # Main API endpoints
        location / {
            proxy_pass http://agent_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Metrics endpoint (if exposed)
        location /metrics {
            access_log off;
            proxy_pass http://agent_api_backend;
        }
    }
}

