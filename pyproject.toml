[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Advanced AI Customer Support Agent powered by MCP and Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.6.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
zendesk = [
    "zendesk>=1.1.0",
]
slack = [
    "slack-sdk>=3.23.0",
]
database = [
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.5.0",
]
memory = [
    "chromadb>=0.4.0",
]

[project.scripts]
customer-support-agent = "agent.main:main"
customer-support-api = "agent.api:run_api"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "config*", "integrations*", "mcp_integrations*", "utils*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

