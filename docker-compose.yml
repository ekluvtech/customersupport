version: '3.8'

services:
  # MCP Server - Unified server for all integrations
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: customer-support-mcp
    ports:
      - "8000:8000"
    environment:
      # Zendesk credentials
      - ZENDESK_SUBDOMAIN=${ZENDESK_SUBDOMAIN:-}
      - ZENDESK_EMAIL=${ZENDESK_EMAIL:-}
      - ZENDESK_API_KEY=${ZENDESK_API_KEY:-}
      # Slack credentials
      - SLACK_TOKEN=${SLACK_TOKEN:-}
      # Database connection
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:pass@db:5432/customersupport}
      # Google Cloud (for Vertex AI)
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      # Mount config if needed
      - ./config:/app/config:ro
      # Mount Google credentials if using Vertex AI
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.google-credentials}:/app/.google-credentials:ro
    networks:
      - customer-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Agent API - Main API server
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: customer-support-api
    ports:
      - "8100:8100"
    environment:
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-vertexai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Google Cloud (for Vertex AI)
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      # MCP Server URL (used in config)
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp-server:8000}
      # Database connection
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:pass@db:5432/customersupport}
      # Memory backend
      - MEMORY_BACKEND=${MEMORY_BACKEND:-memory}
      - CHROMADB_PATH=${CHROMADB_PATH:-/app/data/chroma}
    volumes:
      # Mount config
      - ./config:/app/config:ro
      # Mount Google credentials if using Vertex AI
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.google-credentials}:/app/.google-credentials:ro
      # Mount data directory for ChromaDB if using
      - ./data:/app/data
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - customer-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend - React application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8100
    container_name: customer-support-frontend
    ports:
      - "3000:80"
    depends_on:
      - agent-api
    networks:
      - customer-support-network
    restart: unless-stopped

  # Optional: PostgreSQL database
  # Uncomment if you want to run database in Docker
  # db:
  #   image: postgres:15-alpine
  #   container_name: customer-support-db
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-customersupport}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
  #     - POSTGRES_DB=${POSTGRES_DB:-customersupport}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - customer-support-network
  #   restart: unless-stopped

networks:
  customer-support-network:
    driver: bridge

