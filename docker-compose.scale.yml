version: '3.8'

# Scaled configuration for high-throughput (5k req/s)
# Use with: docker-compose -f docker-compose.yml -f docker-compose.scale.yml up -d

services:
  # Load Balancer for Agent API
  nginx-lb:
    image: nginx:alpine
    container_name: customer-support-lb
    ports:
      - "8100:8100"
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-api
    networks:
      - customer-support-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Scaled Agent API instances
  # Note: Use docker-compose up -d --scale agent-api=10 to scale
  agent-api:
    # Remove port mapping - accessed through load balancer
    ports: []
    environment:
      - WORKER_PROCESSES=4  # Uvicorn workers per instance
      - WORKER_CONNECTIONS=1000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Scaled MCP Server instances
  # Note: Use docker-compose up -d --scale mcp-server=5 to scale
  mcp-server:
    # Remove direct port mapping - accessed through load balancer
    ports: []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # MCP Load Balancer
  nginx-mcp-lb:
    image: nginx:alpine
    container_name: customer-support-mcp-lb
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx-mcp-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mcp-server
    networks:
      - customer-support-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Frontend (can also be scaled if needed)
  # Note: Use docker-compose up -d --scale frontend=3 to scale
  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Redis for session/cache (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: customer-support-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - customer-support-network
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: customer-support-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - customer-support-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: customer-support-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - customer-support-network
    restart: unless-stopped

networks:
  customer-support-network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

